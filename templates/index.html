<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Ticket System — Local</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f2eb;
  --surface: #ede9df;
  --card: #ffffff;
  --border: #d8d0c0;
  --ink: #1a1814;
  --ink2: #4a4640;
  --muted: #8a8278;
  --accent: #2d4a3e;
  --accent2: #c94f2c;
  --accent3: #4a7c6b;
  --stamp: #8b2020;
  --yellow: #f0c040;
  --tag-bg: #e8e0d0;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  background-image:
    radial-gradient(circle at 20% 20%, rgba(45,74,62,0.04) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(201,79,44,0.04) 0%, transparent 50%);
  color: var(--ink);
  font-family: 'JetBrains Mono', monospace;
  min-height: 100vh;
}

/* ── HEADER ── */
header {
  background: var(--accent);
  color: #fff;
  padding: 0 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 72px;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 4px 20px rgba(45,74,62,0.3);
}

.logo-area { display: flex; align-items: center; gap: 14px; }
.logo-box {
  width: 40px; height: 40px;
  background: var(--yellow);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}
.logo-text { font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 800; letter-spacing: -0.01em; }
.logo-sub { font-size: 0.65rem; opacity: 0.6; margin-top: 1px; }

.local-badge {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  color: var(--yellow);
  padding: 6px 14px;
  border-radius: 4px;
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* ── MAIN ── */
main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 48px 40px;
}

/* ── SECTION LABELS ── */
.section-label {
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ── TICKET CARDS ── */
.tickets-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 40px;
}

@media (max-width: 800px) { .tickets-row { grid-template-columns: 1fr; } }

.ticket-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 20px;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
  box-shadow: var(--shadow);
}
.ticket-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--accent);
  border-radius: 4px 0 0 4px;
  opacity: 0;
  transition: opacity 0.15s;
}
.ticket-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: var(--accent); }
.ticket-card:hover::before { opacity: 1; }
.ticket-card.active { border-color: var(--accent); }
.ticket-card.active::before { opacity: 1; }

.ticket-num {
  font-size: 0.6rem;
  color: var(--muted);
  letter-spacing: 0.1em;
  margin-bottom: 8px;
  text-transform: uppercase;
}
.ticket-body {
  font-size: 0.82rem;
  line-height: 1.6;
  color: var(--ink);
  margin-bottom: 14px;
}
.analyze-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--accent);
  background: none;
  border: 1px solid var(--accent);
  border-radius: 3px;
  padding: 5px 12px;
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  transition: all 0.15s;
  letter-spacing: 0.04em;
}
.analyze-btn:hover { background: var(--accent); color: #fff; }

/* ── CUSTOM INPUT ── */
.input-panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 28px;
  margin-bottom: 48px;
  box-shadow: var(--shadow);
}
.input-row { display: flex; gap: 12px; align-items: flex-end; }
textarea {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--ink);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.82rem;
  padding: 12px 14px;
  resize: vertical;
  min-height: 72px;
  transition: border-color 0.15s;
  line-height: 1.6;
}
textarea:focus { outline: none; border-color: var(--accent); }
textarea::placeholder { color: var(--muted); }

.btn-primary {
  background: var(--accent2);
  color: #fff;
  border: none;
  padding: 12px 22px;
  border-radius: 3px;
  font-family: 'Syne', sans-serif;
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  letter-spacing: 0.02em;
}
.btn-primary:hover { background: #a83d20; transform: translateY(-1px); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.btn-all {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 11px 22px;
  border-radius: 3px;
  font-family: 'Syne', sans-serif;
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.02em;
}
.btn-all:hover { background: #1e3329; }
.btn-all:disabled { opacity: 0.5; cursor: not-allowed; }

.top-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  gap: 16px;
  flex-wrap: wrap;
}

/* ── RESULT CARDS ── */
#resultsSection { animation: fadeIn 0.3s ease; }

@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

.result-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 28px 32px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
  animation: fadeIn 0.35s ease;
}

.result-top-border {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
}

.result-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.result-question {
  font-family: 'Syne', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  color: var(--ink);
  flex: 1;
  line-height: 1.4;
}

.tags { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.tag {
  padding: 4px 10px;
  border-radius: 3px;
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.tag-cat { background: var(--tag-bg); color: var(--ink2); border: 1px solid var(--border); }
.tag-high { background: #ffeaea; color: #c0392b; border: 1px solid #f5c6c6; }
.tag-medium { background: #fff4e0; color: #c07800; border: 1px solid #f0d8a0; }
.tag-low { background: #e8f5f0; color: #2d7a5e; border: 1px solid #b0d8c8; }

/* Confidence meter */
.confidence-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}
.conf-label { font-size: 0.65rem; color: var(--muted); white-space: nowrap; text-transform: uppercase; letter-spacing: 0.08em; }
.conf-bar-wrap {
  flex: 1;
  height: 6px;
  background: var(--surface);
  border-radius: 3px;
  overflow: hidden;
  border: 1px solid var(--border);
}
.conf-bar {
  height: 100%;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--accent3), var(--accent));
  transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
}
.conf-val { font-size: 0.7rem; font-weight: 600; color: var(--accent); white-space: nowrap; }

/* Answer box */
.answer-section {
  background: var(--surface);
  border-left: 3px solid var(--accent);
  padding: 16px 18px;
  border-radius: 0 3px 3px 0;
  margin-bottom: 20px;
  font-size: 0.82rem;
  line-height: 1.8;
  color: var(--ink2);
}

/* Steps */
.steps-title {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  margin-bottom: 10px;
  font-weight: 600;
}
.steps-list { list-style: none; display: flex; flex-direction: column; gap: 7px; }
.steps-list li {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 0.78rem;
  line-height: 1.6;
  color: var(--ink2);
}
.step-num {
  min-width: 20px; height: 20px;
  background: var(--accent);
  color: #fff;
  border-radius: 3px;
  font-size: 0.6rem;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  margin-top: 2px;
}

/* Keywords */
.kw-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.kw-chip {
  background: rgba(45,74,62,0.08);
  border: 1px solid rgba(45,74,62,0.2);
  color: var(--accent);
  padding: 2px 9px;
  border-radius: 3px;
  font-size: 0.65rem;
  font-weight: 500;
}

/* Footer meta */
.result-footer {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-top: 18px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  font-size: 0.7rem;
  color: var(--muted);
  flex-wrap: wrap;
}
.result-footer span { display: flex; align-items: center; gap: 5px; }

/* Stamp */
.stamp {
  position: absolute;
  top: 18px; right: 18px;
  width: 64px; height: 64px;
  border: 2px solid;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.55rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  opacity: 0.12;
  text-align: center;
  line-height: 1.3;
  pointer-events: none;
}
.stamp-high { color: #c0392b; border-color: #c0392b; }
.stamp-medium { color: #c07800; border-color: #c07800; }
.stamp-low { color: #2d7a5e; border-color: #2d7a5e; }

/* ── GROUPING PANEL ── */
.groups-panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 28px 32px;
  margin-top: 32px;
  box-shadow: var(--shadow);
}
.groups-heading {
  font-family: 'Syne', sans-serif;
  font-size: 1rem;
  font-weight: 800;
  margin-bottom: 24px;
  color: var(--ink);
}

.group-row {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.group-row:last-child { border-bottom: none; }
.group-dot {
  width: 10px; height: 10px;
  border-radius: 2px;
  flex-shrink: 0;
}
.group-name { font-size: 0.82rem; font-weight: 600; flex: 1; }
.group-count { font-size: 0.7rem; color: var(--muted); margin-right: 8px; }
.group-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.ticket-chip {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 2px 9px;
  font-size: 0.65rem;
  color: var(--ink2);
  font-weight: 500;
}

/* Loading skeleton */
.skeleton {
  background: linear-gradient(90deg, var(--surface) 25%, var(--bg) 50%, var(--surface) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.2s infinite;
  border-radius: 3px;
  height: 14px;
}
@keyframes shimmer { to { background-position: -200% 0; } }

.hidden { display: none; }

/* Loader */
.spinner {
  display: inline-block; width: 12px; height: 12px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  vertical-align: middle; margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="logo-area">
    <div class="logo-box">🎫</div>
    <div>
      <div class="logo-text">AI Ticket System</div>
      <div class="logo-sub">Intelligent Support Classification</div>
    </div>
  </div>
  <div class="local-badge">⬡ Local AI · No API Key</div>
</header>

<main>

  <!-- Sample Tickets -->
  <div class="top-actions">
    <div class="section-label">Sample Tickets</div>
    <button class="btn-all" id="analyzeAllBtn" onclick="analyzeAll()">
      ⚡ Analyze All 3 Tickets
    </button>
  </div>

  <div class="tickets-row">
    {% for ticket in tickets %}
    <div class="ticket-card" id="tc-{{ ticket.id }}" onclick="analyzeOne({{ ticket.id }}, this.dataset.text)" data-text="{{ ticket.text }}">
      <div class="ticket-num">Ticket #{{ '%03d' % ticket.id }}</div>
      <div class="ticket-body">{{ ticket.text }}</div>
      <button class="analyze-btn" onclick="event.stopPropagation(); analyzeOne({{ ticket.id }}, '{{ ticket.text|replace("'","\\'") }}')">
        Classify →
      </button>
    </div>
    {% endfor %}
  </div>

  <!-- Custom Input -->
  <div class="input-panel">
    <div class="section-label" style="margin-bottom:14px">Submit Custom Ticket</div>
    <div class="input-row">
      <textarea id="customText" placeholder="Type your support issue here..."></textarea>
      <button class="btn-primary" onclick="analyzeCustom()">Classify</button>
    </div>
  </div>

  <!-- Results -->
  <div id="resultsSection" class="hidden">
    <div class="section-label">Analysis Results</div>
    <div id="resultsContainer"></div>
    <div id="groupsPanel" class="groups-panel hidden">
      <div class="groups-heading">🗂 Ticket Grouping Summary</div>
      <div id="groupsContainer"></div>
    </div>
  </div>

</main>

<script>
let allResults = [];

const CAT_COLORS = {
  "Password & Authentication": "#7c6aff",
  "HR & Leave Management": "#2d9e7e",
  "Technical Support": "#e8892a",
  "Account & Access Management": "#e05555",
  "General Inquiry": "#4a90d9"
};

function priorityTag(p) {
  const cls = p === 'High' ? 'tag-high' : p === 'Medium' ? 'tag-medium' : 'tag-low';
  return `<span class="tag ${cls}">${p === 'High' ? '▲' : p === 'Medium' ? '◆' : '▼'} ${p}</span>`;
}

function stampClass(p) {
  return p === 'High' ? 'stamp-high' : p === 'Medium' ? 'stamp-medium' : 'stamp-low';
}

function renderResult(r) {
  const steps = (r.suggested_steps || []).map((s, i) =>
    `<li><div class="step-num">${i+1}</div><span>${s}</span></li>`
  ).join('');

  const keywords = (r.matched_keywords || []).map(k =>
    `<span class="kw-chip">${k}</span>`
  ).join('');

  const color = CAT_COLORS[r.category] || '#888';
  const confWidth = Math.max(r.confidence || 0, 10);

  return `
  <div class="result-card" id="result-${r.ticket_id || 'custom'}">
    <div class="result-top-border" style="background:${color}"></div>
    <div class="stamp ${stampClass(r.priority)}">${r.priority}<br>Priority</div>

    <div class="result-header">
      <div class="result-question">"${r.ticket_text}"</div>
      <div class="tags">
        <span class="tag tag-cat">${r.category}</span>
        ${priorityTag(r.priority)}
      </div>
    </div>

    <div class="confidence-row">
      <span class="conf-label">AI Confidence</span>
      <div class="conf-bar-wrap">
        <div class="conf-bar" id="bar-${r.ticket_id||'custom'}" style="width:0%"></div>
      </div>
      <span class="conf-val">${r.confidence}%</span>
    </div>

    <div class="answer-section">${r.answer}</div>

    <div class="steps-title">Resolution Steps</div>
    <ul class="steps-list">${steps}</ul>

    ${keywords ? `<div class="kw-row">${keywords}</div>` : ''}

    <div class="result-footer">
      <span>⏱ ${r.estimated_resolution}</span>
      <span>📧 Escalate to: ${r.escalate_to}</span>
      <span>🕐 ${r.timestamp || ''}</span>
      ${r.ticket_id ? `<span>🎫 #${String(r.ticket_id).padStart(3,'0')}</span>` : ''}
      <span style="margin-left:auto; color:var(--accent); font-size:0.6rem">${r.model || ''}</span>
    </div>
  </div>`;
}

function animateBar(id, width) {
  setTimeout(() => {
    const el = document.getElementById(`bar-${id}`);
    if (el) el.style.width = width + '%';
  }, 150);
}

function renderGroups(results) {
  const groups = {};
  results.forEach(r => {
    const cat = r.category || 'Other';
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(r);
  });

  return Object.entries(groups).map(([cat, items]) => {
    const color = CAT_COLORS[cat] || '#888';
    const chips = items.map(r =>
      `<span class="ticket-chip">#${String(r.ticket_id||'?').padStart(3,'0')}</span>`
    ).join('');
    return `<div class="group-row">
      <div class="group-dot" style="background:${color}"></div>
      <div class="group-name">${cat}</div>
      <div class="group-count">${items.length} ticket${items.length>1?'s':''}</div>
      <div class="group-chips">${chips}</div>
    </div>`;
  }).join('');
}

async function analyzeOne(id, text) {
  if (!text) text = document.querySelector(`#tc-${id}`)?.dataset.text || '';
  document.querySelectorAll('.ticket-card').forEach(c => c.classList.remove('active'));
  document.getElementById(`tc-${id}`)?.classList.add('active');
  showResults();
  const container = document.getElementById('resultsContainer');
  const loadingHtml = `<div class="result-card" id="result-${id}" style="padding:40px;text-align:center;color:var(--muted)">
    <div class="skeleton" style="width:60%;margin:0 auto 10px"></div>
    <div class="skeleton" style="width:40%;margin:0 auto;height:10px"></div>
  </div>`;
  const old = document.getElementById(`result-${id}`);
  if (old) old.outerHTML = loadingHtml;
  else container.insertAdjacentHTML('afterbegin', loadingHtml);

  const res = await fetch('/api/analyze', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({text})
  });
  const data = await res.json();
  data.ticket_id = id;
  document.getElementById(`result-${id}`).outerHTML = renderResult(data);
  animateBar(id, data.confidence);
  allResults = allResults.filter(r => r.ticket_id !== id);
  allResults.push(data);
}

async function analyzeAll() {
  const btn = document.getElementById('analyzeAllBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Analyzing...';
  showResults();
  document.getElementById('resultsContainer').innerHTML =
    '<div class="result-card" style="padding:40px;text-align:center;color:var(--muted)"><span class="spinner" style="border-top-color:var(--accent)"></span> Running local AI model...</div>';

  const res = await fetch('/api/analyze-all', {method:'POST'});
  const results = await res.json();
  allResults = results;

  document.getElementById('resultsContainer').innerHTML = results.map(renderResult).join('');
  results.forEach(r => animateBar(r.ticket_id, r.confidence));

  document.getElementById('groupsContainer').innerHTML = renderGroups(results);
  document.getElementById('groupsPanel').classList.remove('hidden');

  btn.disabled = false;
  btn.innerHTML = '⚡ Analyze All 3 Tickets';
}

async function analyzeCustom() {
  const ta = document.getElementById('customText');
  const text = ta.value.trim();
  if (!text) { ta.focus(); return; }
  showResults();
  const container = document.getElementById('resultsContainer');
  container.insertAdjacentHTML('afterbegin',
    '<div class="result-card" id="result-custom" style="padding:40px;text-align:center;color:var(--muted)">Classifying...</div>');
  const res = await fetch('/api/analyze', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({text})
  });
  const data = await res.json();
  data.ticket_id = 'custom';
  document.getElementById('result-custom').outerHTML = renderResult(data);
  animateBar('custom', data.confidence);
  ta.value = '';
}

function showResults() {
  const sec = document.getElementById('resultsSection');
  sec.classList.remove('hidden');
  setTimeout(() => sec.scrollIntoView({behavior:'smooth', block:'start'}), 100);
}
</script>

</body>
</html>
